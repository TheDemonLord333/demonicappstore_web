# Beispiel-Nginx-Konfiguration für den Demonic App Store
# Domain hier durch die eigene ersetzen und nach
# /etc/nginx/sites-available/demonic-app-store.conf kopieren, dann:
#   ln -s /etc/nginx/sites-available/demonic-app-store.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# HTTPS-Zertifikat wird separat mit certbot erzeugt (siehe README).

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name das.thedemonlord333.me;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name das.thedemonlord333.me;

    # Von certbot verwaltete Zertifikatspfade (siehe README, Abschnitt HTTPS)
    ssl_certificate     /etc/letsencrypt/live/das.thedemonlord333.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/das.thedemonlord333.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Große IPA-Uploads über das Admin-Panel erlauben (siehe MAX_IPA_SIZE_MB in .env)
    client_max_body_size 550M;
    client_body_timeout 300s;

    # Zeitlimits für sehr große Uploads/Downloads etwas anheben
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    access_log /var/log/nginx/demonic-app-store.access.log;
    error_log  /var/log/nginx/demonic-app-store.error.log;

    location / {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
